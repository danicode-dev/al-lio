services:
  al_lio_web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: al_lio_web
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "3000"
    networks:
      - danicode_web
      - al_lio_internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      al_lio_postgres:
        condition: service_healthy

  al_lio_postgres:
    image: postgres:17-alpine
    container_name: al_lio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: al_lio
      POSTGRES_USER: al_lio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - al_lio_postgres_data:/var/lib/postgresql/data
    networks:
      - al_lio_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_lio -d al_lio"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  danicode_web:
    external: true
  al_lio_internal:

volumes:
  al_lio_postgres_data:
