services:
  aidraft_web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: aidraft_web
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "3000"
    networks:
      - danicode_web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  danicode_web:
    external: true
