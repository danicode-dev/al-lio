services:
  aidraft_postgres_local:
    image: postgres:17-alpine
    container_name: aidraft_postgres_local
    environment:
      POSTGRES_USER: aidraft
      POSTGRES_PASSWORD: aidraft_local_password
      POSTGRES_DB: aidraft
    ports:
      - "54329:5432"
    volumes:
      - aidraft_postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidraft -d aidraft"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  aidraft_postgres_local_data:
