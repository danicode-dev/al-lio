    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <rect width="1200" height="600" fill="url(#lines)"/>
  <path d="M-80 545C180 410 342 510 570 362S927 138 1280 226" fill="none" stroke="#f7d4c3" stroke-opacity=".12" stroke-width="3"/>
