<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Eventos y retos</title>
  <desc id="description">Fondo abstracto cálido con líneas de conexión para representar colaboración y comunidad.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b25"/>
      <stop offset="0.55" stop-color="#2c2630"/>
      <stop offset="1" stop-color="#6b3323"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="72%">
      <stop offset="0" stop-color="#f06a37" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f06a37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="190" height="190" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 32h190M0 126h190" stroke="#fff" stroke-opacity=".075" stroke-width="2"/>
      <circle cx="42" cy="32" r="5" fill="#f5c5ad" fill-opacity=".42"/>
